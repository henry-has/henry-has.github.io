<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography · henry-has</title>
<style>
:root{--bg:#fff;--fg:#111;--mute:#777;--link:#0b5fd0}
@media (prefers-color-scheme: dark){:root{--bg:#161616;--fg:#eee;--mute:#999;--link:#6aa5ef}}
body{font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:960px;margin:40px auto;padding:0 16px;color:var(--fg);background:var(--bg)}
a{color:var(--link)}
h1{font-size:20px;margin:0 0 4px}
p.sub{margin:0 0 20px;color:var(--mute)}
.g{columns:3 220px;column-gap:8px}
figure{margin:0 0 8px;break-inside:avoid;cursor:zoom-in}
figure img{display:block;width:100%;height:auto;border-radius:3px;background:var(--mute);opacity:.999;transition:opacity .15s}
figure:hover img{opacity:.85}
figcaption{font-size:12px;color:var(--mute);margin-top:3px}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;color:#bbb;z-index:9;font-size:13px;cursor:zoom-out}
#lb.on{display:flex}
#lb img{max-width:96vw;max-height:84vh;object-fit:contain}
#lb a{color:#9bc1f5}
footer{margin-top:24px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<h1>Photography</h1>
<p class="sub">37 photos, newest first. <a href="https://adobe.ly/3BKNBeR" rel="noopener">Full portfolio on Lightroom →</a></p>
<main class="g" id="g"></main>
<div id="lb" role="dialog" aria-modal="true"><img id="li" alt=""><span><span id="lc"></span> · <a id="dl" href="#" target="_blank" rel="noopener">open full size</a></span></div>
<footer><a href="../">← Projects</a></footer>
<script>
const P=[["img/36t.jpg",[4000,6000],"2025-06-11","img/36l.jpg"],["img/37t.jpg",[5618,3160],"2025-06-11","img/37l.jpg"],["img/34t.jpg",[6000,3375],"2025-06-07","img/34l.jpg"],["img/35t.jpg",[4762,3810],"2025-06-07","img/35l.jpg"],["img/32t.jpg",[3995,5992],"2025-06-06","img/32l.jpg"],["img/33t.jpg",[4000,6000],"2025-06-06","img/33l.jpg"],["img/30t.jpg",[3796,2531],"2025-06-05","img/30l.jpg"],["img/31t.jpg",[4000,6000],"2025-06-05","img/31l.jpg"],["img/29t.jpg",[5563,3129],"2025-06-03","img/29l.jpg"],["img/28t.jpg",[6000,4000],"2025-05-31","img/28l.jpg"],["img/26t.jpg",[6000,4000],"2024-03-16","img/26l.jpg"],["img/27t.jpg",[6000,3375],"2024-03-16","img/27l.jpg"],["img/25t.jpg",[4304,2869],"2023-07-20","img/25l.jpg"],["img/24t.jpg",[5384,3029],"2023-07-18","img/24l.jpg"],["img/23t.jpg",[5709,3806],"2023-06-10","img/23l.jpg"],["img/16t.jpg",[5483,3084],"2023-04-04","img/16l.jpg"],["img/17t.jpg",[5874,3304],"2023-04-04","img/17l.jpg"],["img/18t.jpg",[5416,3047],"2023-04-04","img/18l.jpg"],["img/19t.jpg",[3736,5603],"2023-04-04","img/19l.jpg"],["img/20t.jpg",[3949,5924],"2023-04-04","img/20l.jpg"],["img/21t.jpg",[3921,5881],"2023-04-04","img/21l.jpg"],["img/22t.jpg",[5997,3373],"2023-04-04","img/22l.jpg"],["img/15t.jpg",[3689,4918],"2022-09-29","img/15l.jpg"],["img/14t.jpg",[6000,3375],"2022-07-22","img/14l.jpg"],["img/10t.jpg",[3440,2580],"2022-07-21","img/10l.jpg"],["img/11t.jpg",[3460,2595],"2022-07-21","img/11l.jpg"],["img/12t.jpg",[3842,2161],"2022-07-21","img/12l.jpg"],["img/13t.jpg",[5767,3244],"2022-07-21","img/13l.jpg"],["img/09t.jpg",[3612,5418],"2022-07-20","img/09l.jpg"],["img/08t.jpg",[3781,2127],"2022-07-19","img/08l.jpg"],["img/06t.jpg",[5155,3436],"2022-07-18","img/06l.jpg"],["img/07t.jpg",[5029,2829],"2022-07-18","img/07l.jpg"],["img/05t.jpg",[6000,3375],"2022-07-10","img/05l.jpg"],["img/03t.jpg",[5103,3402],"2022-07-06","img/03l.jpg"],["img/04t.jpg",[6000,4000],"2022-07-06","img/04l.jpg"],["img/02t.jpg",[4000,5333],"2022-07-05","img/02l.jpg"],["img/01t.j const g=document.getElementById('g'),lb=document.getElementById('lb'),li=document.getElementById('li'),lc=document.getElementById('lc'),dl=document.getElementById('dl');
let cur=0;
function show(i){cur=(i+P.length)%P.length;const p=P[cur];li.src=p[3]||p[0];lc.textContent=p[2]+' · '+(cur+1)+'/'+P.length;dl.href=p[3]||p[0];lb.classList.add('on')}
P.forEach((p,i)=>{const f=document.createElement('figure');f.innerHTML='<img loading="lazy" decoding="async" width="'+p[1][0]+'" height="'+p[1][1]+'" src="'+p[0]+'" alt="Photo from '+p[2]+'"><figcaption>'+p[2]+'</figcaption>';f.onclick=()=>show(i);g.appendChild(f)});
lb.onclick=e=>{if(e.target.id!=='dl')lb.classList.remove('on')};
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')lb.classList.remove('on');if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
</script>
</body>
</html>
