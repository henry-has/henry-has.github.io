<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Photography · henry-has</title>
<style>
:root{--bg:#fafafa;--fg:#0c0c0c;--mute:#8a8a8a}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0b;--fg:#ededed;--mute:#777}}
:root{--gx:clamp(16px,2.2vw,28px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;gap:16px;padding:18px var(--gx);background:linear-gradient(var(--bg),transparent);text-transform:uppercase}
header span:last-child{color:var(--mute)}
.g{display:flex;flex-wrap:wrap;gap:4px;padding:8px var(--gx) 0}
.g:after{content:"";flex-grow:1000}
figure{margin:0;position:relative;cursor:zoom-in;overflow:hidden;flex-grow:var(--r);flex-basis:calc(var(--r)*clamp(140px,22vw,260px));background:color-mix(in srgb,var(--fg) 6%,transparent)}
figure img{display:block;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.2,1),filter .3s}
figure img.in{opacity:1}
.g:hover figure img.in{filter:brightness(.6) saturate(.8)}
.g figure:hover img.in{filter:none;transform:scale(1.015)}
figcaption{position:absolute;left:10px;bottom:8px;color:#fff;mix-blend-mode:difference;opacity:0;transition:opacity .25s;pointer-events:none}
figure:hover figcaption{opacity:1}
footer{display:flex;justify-content:space-between;padding:56px var(--gx) 32px;color:var(--mute);text-transform:uppercase}
#lb{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:9;cursor:zoom-out;padding:56px 16px}
#lb.on{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:calc(100vh - 112px);max-height:calc(100dvh - 112px);object-fit:contain;transition:opacity .25s}
#lb .b{position:absolute;left:var(--gx);right:var(--gx);display:flex;justify-content:space-between;text-transform:uppercase}
#lt{top:18px}#lbm{bottom:18px;color:var(--mute)}
#lb button{all:unset;cursor:pointer;color:var(--mute);transition:color .2s}#lb button:hover{color:var(--fg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><span>Henry Haskins</span><span>Photography · 37</span></header>
<main class="g" id="g"></main>
<footer><a href="../">← henry-has</a><span>2021 – 2025</span></footer>
<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer"><div class="b" id="lt"><span id="lc"></span><span id="ld"></span><button>Close</button></div><img id="li" alt=""><div class="b" id="lbm"><button id="pv">← Prev</button><button id="nx">Next →</button></div></div>
<script>
const P=[["img/36t.jpg",[4000,6000],"2025-06-11","img/36l.jpg"],["img/37t.jpg",[5618,3160],"2025-06-11","img/37l.jpg"],["img/34t.jpg",[6000,3375],"2025-06-07","img/34l.jpg"],["img/35t.jpg",[4762,3810],"2025-06-07","img/35l.jpg"],["img/32t.jpg",[3995,5992],"2025-06-06","img/32l.jpg"],["img/33t.jpg",[4000,6000],"2025-06-06","img/33l.jpg"],["img/30t.jpg",[3796,2531],"2025-06-05","img/30l.jpg"],["img/31t.jpg",[4000,6000],"2025-06-05","img/31l.jpg"],["img/29t.jpg",[5563,3129],"2025-06-03","img/29l.jpg"],["img/28t.jpg",[6000,4000],"2025-05-31","img/28l.jpg"],["img/26t.jpg",[6000,4000],"2024-03-16","img/26l.jpg"],["img/27t.jpg",[6000,3375],"2024-03-16","img/27l.jpg"],["img/25t.jpg",[4304,2869],"2023-07-20","img/25l.jpg"],["img/24t.jpg",[5384,3029],"2023-07-18","img/24l.jpg"],["img/23t.jpg",[5709,3806],"2023-06-10","img/23l.jpg"],["img/16t.jpg",[5483,3084],"2023-04-04","img/16l.jpg"],["img/17t.jpg",[5874,3304],"2023-04-04","img/17l.jpg"],["img/18t.jpg",[5416,3047],"2023-04-04","img/18l.jpg"],["img/19t.jpg",[3736,5603],"2023-04-04","img/19l.jpg"],["img/20t.jpg",[3949,5924],"2023-04-04","img/20l.jpg"],["img/21t.jpg",[3921,5881],"2023-04-04","img/21l.jpg"],["img/22t.jpg",[5997,3373],"2023-04-04","img/22l.jpg"],["img/15t.jpg",[3689,4918],"2022-09-29","img/15l.jpg"],["img/14t.jpg",[6000,3375],"2022-07-22","img/14l.jpg"],["img/10t.jpg",[3440,2580],"2022-07-21","img/10l.jpg"],["img/11t.jpg",[3460,2595],"2022-07-21","img/11l.jpg"],["img/12t.jpg",[3842,2161],"2022-07-21","img/12l.jpg"],["img/13t.jpg",[5767,3244],"2022-07-21","img/13l.jpg"],["img/09t.jpg",[3612,5418],"2022-07-20","img/09l.jpg"],["img/08t.jpg",[3781,2127],"2022-07-19","img/08l.jpg"],["img/06t.jpg",[5155,3436],"2022-07-18","img/06l.jpg"],["img/07t.jpg",[5029,2829],"2022-07-18","img/07l.jpg"],["img/05t.jpg",[6000,3375],"2022-07-10","img/05l.jpg"],["img/03t.jpg",[5103,3402],"2022-07-06","img/03l.jpg"],["img/04t.jpg",[6000,4000],"2022-07-06","img/04l.jpg"],["img/02t.jpg",[4000,5333],"2022-07-05","img/02l.jpg"],["img/01t.jpg",[5333,4000],"2021-11-25","img/01l.jpg"]];
const g=document.getElementById('g'),lb=document.getElementById('lb'),li=document.getElementById('li'),lc=document.getElementById('lc'),ld=document.getElementById('ld');let cur=0,tx=0;
const pad=n=>String(n).padStart(2,'0');
function show(i){cur=(i+P.length)%P.length;const p=P[cur];li.style.opacity=0;const s=p[3]||p[0];const n=new Image();n.onload=()=>{li.src=s;li.style.opacity=1};n.src=s;lc.textContent=pad(cur+1)+' / '+P.length;ld.textContent=p[2];lb.classList.add('on');document.body.style.overflow='hidden'}
function hide(){lb.classList.remove('on');document.body.style.overflow=''}
P.forEach((p,i)=>{const f=document.createElement('figure');f.style.setProperty('--r',(p[1][0]/p[1][1]).toFixed(3));f.tabIndex=0;f.innerHTML='<img decoding="async" width="'+p[1][0]+'" height="'+p[1][1]+'" src="'+p[0]+'" alt="Photograph, '+p[2]+'"><figcaption>'+pad(i+1)+' · '+p[2]+'</figcaption>';const im=f.firstChild;im.complete?im.classList.add('in'):im.onload=()=>im.classList.add('in');f.onclick=()=>show(i);f.onkeydown=e=>e.key==='Enter'&&show(i);g.appendChild(f)});
lb.onclick=e=>{if(!e.target.closest('button'))hide()};
document.getElementById('pv').onclick=()=>show(cur-1);document.getElementById('nx').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(!lb.classList.contains('on'))return;if(e.key==='Escape')hide();if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
lb.addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});lb.addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>50)show(cur+(d<0?1:-1))});
</script>
