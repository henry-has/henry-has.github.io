<style>
:root{--bg:#fafafa;--fg:#0c0c0c;--mute:#8a8a8a}
@media (prefers-color-scheme: dark){:root{--bg:#0b0b0b;--fg:#ededed;--mute:#777}}
:root{--gx:clamp(16px,2.2vw,28px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.02em;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:18px var(--gx);mix-blend-mode:difference;color:#fff;text-transform:uppercase}
header span:nth-child(2){opacity:.55}
.w{container-type:inline-size;padding:8px var(--gx) 0}
.g{display:grid;grid-template-columns:repeat(6,1fr);grid-auto-rows:calc((100cqw - 20px)/6);grid-auto-flow:dense;gap:4px}
figure{margin:0;position:relative;cursor:zoom-in;overflow:hidden;grid-column:span var(--cw);grid-row:span var(--ch);background:color-mix(in srgb,var(--fg) 6%,transparent)}
figure img{display:block;width:100%;height:100%;object-fit:cover;object-position:var(--px) var(--py);opacity:0;transition:opacity .6s ease,scale .8s cubic-bezier(.2,.7,.2,1),filter .3s}
figure img.in{opacity:1}
.g:hover figure img.in{filter:brightness(.6) saturate(.8)}
.g figure:hover img.in{filter:none;scale:1.04}
.par figure img{scale:1.18}
.par .g figure:hover img.in{scale:1.25}
.par header>span{will-change:translate}
.g{transition:opacity .2s}.g.swap{opacity:0}
.g.full{display:flex;flex-wrap:wrap}
.g.full:after{content:"";flex-grow:1000}
.g.full figure{grid-column:auto;grid-row:auto;aspect-ratio:var(--r);flex-grow:var(--r);flex-basis:calc(var(--r)*clamp(140px,22vw,260px))}
.g.full img{object-position:50% 50%}
.ctl{display:flex;gap:14px;justify-content:flex-end}
.ctl button{all:unset;cursor:pointer;opacity:.55;transition:opacity .2s}
.ctl button:hover,.ctl button[aria-pressed=true]{opacity:1}
header .ctl button:focus-visible{outline:1px solid #fff;outline-offset:3px}
figcaption{position:absolute;left:10px;bottom:8px;color:#fff;mix-blend-mode:difference;opacity:0;transition:opacity .25s;pointer-events:none}
figure:hover figcaption{opacity:1}
footer{display:flex;justify-content:space-between;padding:56px var(--gx) 32px;color:var(--mute);text-transform:uppercase}
#lb{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;opacity:0;visibility:hidden;transition:opacity .3s,visibility .3s;z-index:9;cursor:zoom-out;padding:56px 16px}
#lb.on{opacity:1;visibility:visible}
#lb img{max-width:100%;max-height:calc(100vh - 112px);max-height:calc(100dvh - 112px);object-fit:contain;transition:opacity .25s}
#lb .b{position:absolute;left:var(--gx);right:var(--gx);display:flex;justify-content:space-between;text-transform:uppercase}
#lt{top:18px}#lbm{bottom:18px;color:var(--mute)}
#lb button{all:unset;cursor:pointer;color:var(--mute);transition:color .2s}#lb button:hover{color:var(--fg)}
:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const g=document.getElementById('g'),lb=document.getElementById('lb'),li=document.getElementById('li'),lc=document.getElementById('lc'),ld=document.getElementById('ld'),bc=document.getElementById('mc'),bf=document.getElementById('mf');
let cur=0,tx=0,ord=[],crop=Math.random()<.5;
const pad=n=>String(n).padStart(2,'0');
const F=P.map((p,i)=>{const f=document.createElement('figure');f.style.cssText='--r:'+(p[1][0]/p[1][1]).toFixed(3)+';--cw:'+p[4][0]+';--ch:'+p[4][1]+';--px:'+p[4][2]+'%;--py:'+p[4][3]+'%';f.tabIndex=0;f.innerHTML='<img decoding="async" src="'+p[0]+'" alt="Photograph, '+p[2]+'"><figcaption></figcaption>';const im=f.firstChild;im.complete?im.classList.add('in'):im.onload=()=>im.classList.add('in');f.onclick=()=>show(ord.indexOf(i));f.onkeydown=e=>e.key==='Enter'&&show(ord.indexOf(i));return f});
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function holes(o){const occ=new Set();let H=0;for(const i of o){const w=P[i][4][0],h=P[i][4][1];for(let r=0;;r++){let c=0;for(;c<=6-w;c++){let ok=true;for(let y=0;y<h&&ok;y++)for(let x=0;x<w;x++)if(occ.has((r+y)*6+c+x)){ok=false;break}if(ok)break}if(c<=6-w){for(let y=0;y<h;y++)for(let x=0;x<w;x++)occ.add((r+y)*6+c+x);H=Math.max(H,r+h);break}}}let n=0;for(let r=0;r<H-3;r++)for(let c=0;c<6;c++)if(!occ.has(r*6+c))n++;return n}
function plan(){let o=shuffle(P.map((_,i)=>i)),s=holes(o);for(let k=0;k<8000&&s>0;k++){const t=o.slice(),a=Math.random()*t.length|0;if(Math.random()<.5){const b=Math.random()*t.length|0;[t[a],t[b]]=[t[b],t[a]]}else{const x=t.splice(a,1)[0];t.splice(Math.random()*(t.length+1)|0,0,x)}const n=holes(t);if(n<=s){o=t;s=n}}return o}
function layout(){ord=crop?plan():shuffle(P.map((_,i)=>i));g.classList.toggle('full',!crop);bc.setAttribute('aria-pressed',crop);bf.setAttribute('aria-pressed',!crop);ord.forEach((i,k)=>{F[i].lastChild.textContent=pad(k+1)+' · '+P[i][2];g.appendChild(F[i])});requestAnimationFrame(measure)}
function go(){g.classList.add('swap');setTimeout(()=>{layout();g.classList.remove('swap')},matchMedia('(prefers-reduced-motion:reduce)').matches?0:200)}
function show(k){cur=(k+ord.length)%ord.length;const p=P[ord[cur]];li.style.opacity=0;const s=p[3]||p[0];const n=new Image();n.onload=()=>{li.src=s;li.style.opacity=1};n.src=s;lc.textContent=pad(cur+1)+' / '+P.length;ld.textContent=p[2];lb.classList.add('on');document.body.style.overflow='hidden'}

const R=!matchMedia('(prefers-reduced-motion:reduce)').matches,hd=document.querySelectorAll('header>span');let T=[],cs=scrollY,pend=0;
function measure(){if(!R)return;document.documentElement.classList.add('par');F.forEach(f=>{f.style.translate=f.style.rotate=f.style.scale='';f.firstChild.style.translate=''});T=ord.map(i=>{const f=F[i],r=f.getBoundingClientRect(),k=Math.random();return{f,im:f.firstChild,y:r.top+scrollY+r.height/2,h:r.height,d:(Math.random()*2-1)*.17,k:k<.16?1:k<.32?2:k<.42?3:0,p:Math.random()*6.28,s:Math.random()<.5?-1:1}});tick(1)}
function tick(now){pend=0;cs+=(scrollY-cs)*(now?1:.09);const vh=innerHeight,c=cs+vh/2;for(const t of T){const o=t.y-c;if(Math.abs(o)>vh*1.2)continue;let x=0,r=0,z=1;const y=Math.max(-42,Math.min(42,o*t.d));if(t.k===1)x=Math.sin(cs/170+t.p)*18;if(t.k===2)r=o/vh*4*t.s;if(t.k===3)z=1.04-Math.min(Math.abs(o)/vh,1)*.11;t.f.style.translate=x.toFixed(1)+'px '+y.toFixed(1)+'px';t.f.style.rotate=r.toFixed(2)+'deg';t.f.style.scale=z.toFixed(3);t.f.style.zIndex=t.k===3&&z>1?2:'';const m=.08*t.h;t.im.style.translate='0 '+Math.max(-m,Math.min(m,-o*.09)).toFixed(1)+'px'}
